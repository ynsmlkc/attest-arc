<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="70%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>
    <linearGradient id="primaryCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#4361EE" />
    </linearGradient>
    <linearGradient id="shieldViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132038" stroke-width="0.75" opacity="0.6" />
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="48" fill="url(#bgGlow)" />
  <rect width="600" height="600" rx="48" fill="url(#grid)" />

  <circle cx="300" cy="255" r="145" fill="#00BBF9" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="300" cy="375" r="95" fill="#7928CA" opacity="0.15" filter="url(#softGlow)" />

  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="185" fill="none" stroke="#1a2d4b" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.7" />
    <circle cx="0" cy="0" r="165" fill="none" stroke="url(#primaryCyan)" stroke-width="2" stroke-dasharray="90 35 40 35" opacity="0.55" />

    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70"
             fill="#080f1a" fill-opacity="0.85" stroke="#1e3352" stroke-width="2" />

    <path d="M 0,-140 L 0,0 L 121,70" fill="none" stroke="#162942" stroke-width="1.5" />
    <path d="M 0,0 L -121,70" fill="none" stroke="#162942" stroke-width="1.5" />

    <path d="M 0,-115 L -72,35 L -42,35 L -18,-15 L 0,-52 Z" fill="url(#primaryCyan)" filter="url(#neonGlow)" />
    <path d="M 0,-115 L 72,35 L 42,35 L 18,-15 L 0,-52 Z" fill="url(#shieldViolet)" />

    <polygon points="0,-25 28,25 0,75 -28,25" fill="#0b1524" stroke="url(#primaryCyan)" stroke-width="3" filter="url(#neonGlow)" />
    <circle cx="0" cy="25" r="8" fill="#00F5D4" filter="url(#neonGlow)" />
    <rect x="-48" y="18" width="96" height="5" rx="2.5" fill="#ffffff" opacity="0.95" filter="url(#neonGlow)" />

    <circle cx="0" cy="-140" r="4" fill="#00F5D4" />
    <circle cx="121" cy="-70" r="3.5" fill="#00BBF9" />
    <circle cx="121" cy="70" r="3.5" fill="#4361EE" />
    <circle cx="0" cy="140" r="4" fill="#7928CA" />
    <circle cx="-121" cy="70" r="3.5" fill="#4361EE" />
    <circle cx="-121" cy="-70" r="3.5" fill="#00BBF9" />

    <path d="M -8,25 L -2,31 L 8,19" fill="none" stroke="#04111d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="306" y="505"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif"
        font-size="46" font-weight="900" letter-spacing="12"
        text-anchor="middle" fill="#FFFFFF">ATTEST</text>
</svg>
