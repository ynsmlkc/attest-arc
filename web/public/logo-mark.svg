<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -160 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#4361EE" />
    </linearGradient>
    <linearGradient id="shieldViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="0" cy="0" r="150" fill="none" stroke="url(#primaryCyan)" stroke-width="3" stroke-dasharray="70 28 32 28" opacity="0.55" />
  <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70"
           fill="#080f1a" fill-opacity="0.85" stroke="#1e3352" stroke-width="2.5" />
  <path d="M 0,-115 L -72,35 L -42,35 L -18,-15 L 0,-52 Z" fill="url(#primaryCyan)" filter="url(#neonGlow)" />
  <path d="M 0,-115 L 72,35 L 42,35 L 18,-15 L 0,-52 Z" fill="url(#shieldViolet)" />
  <polygon points="0,-25 28,25 0,75 -28,25" fill="#0b1524" stroke="url(#primaryCyan)" stroke-width="3.5" filter="url(#neonGlow)" />
  <circle cx="0" cy="25" r="8" fill="#00F5D4" filter="url(#neonGlow)" />
  <rect x="-48" y="18" width="96" height="5" rx="2.5" fill="#ffffff" opacity="0.95" filter="url(#neonGlow)" />
</svg>
