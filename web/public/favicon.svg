<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="70%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>
    <linearGradient id="primaryCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#4361EE" />
    </linearGradient>
    <linearGradient id="shieldViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" rx="120" fill="url(#bgGlow)" />

  <g transform="translate(300, 300) scale(1.7)">
    <circle cx="0" cy="0" r="185" fill="none" stroke="url(#primaryCyan)" stroke-width="4" stroke-dasharray="90 35 40 35" opacity="0.55" />
    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70"
             fill="#080f1a" fill-opacity="0.85" stroke="#1e3352" stroke-width="3" />
    <path d="M 0,-115 L -72,35 L -42,35 L -18,-15 L 0,-52 Z" fill="url(#primaryCyan)" filter="url(#neonGlow)" />
    <path d="M 0,-115 L 72,35 L 42,35 L 18,-15 L 0,-52 Z" fill="url(#shieldViolet)" />
    <polygon points="0,-25 28,25 0,75 -28,25" fill="#0b1524" stroke="url(#primaryCyan)" stroke-width="4" filter="url(#neonGlow)" />
    <circle cx="0" cy="25" r="9" fill="#00F5D4" filter="url(#neonGlow)" />
    <rect x="-48" y="18" width="96" height="6" rx="3" fill="#ffffff" opacity="0.95" filter="url(#neonGlow)" />
  </g>
</svg>
